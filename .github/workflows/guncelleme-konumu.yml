name: Yayımlanmış güncelleme — aynı kurulum konumu
on:
  workflow_dispatch:
  push:
    branches: ['codex/guncelleme-konumu-*']
permissions:
  contents: read
concurrency:
  group: guncelleme-konumu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  konum:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Yayımlanmış sürümleri hazırla
        shell: pwsh
        run: |
          New-Item -ItemType Directory onceki-kurulum | Out-Null
          gh release download v0.0.5 --repo "$env:GITHUB_REPOSITORY" --pattern Notes.exe --dir onceki-kurulum
          if ($LASTEXITCODE -ne 0) { throw 'Eski yayın indirilemedi.' }
          if ((Get-FileHash ./onceki-kurulum/Notes.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b07e9f52cc42c72fb2eb74b29a5c388d1845f779791a563feeff2320f21573ed') { throw 'Eski yayın özeti farklı.' }
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v0.0.6" | Set-Content ./onceki-kurulum/yayin.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Yeni yayın bilgisi alınamadı.' }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Standart yetkiyle gerçek 0.0.5 → 0.0.6; varsayılan ve özel klasör
        shell: pwsh
        run: ./denetimler/windows-standart-kullanıcı.ps1 -KurulumKlasoru ./onceki-kurulum -GuncellemeKonumu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Kanıtları sakla
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Guncelleme-konumu-kanitlari
          path: denetim-çıktıları/
          retention-days: 14
          if-no-files-found: error
