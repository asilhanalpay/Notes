name: Güncel paket — aynı kurulum konumu
on:
  workflow_dispatch:
  push:
    branches: ['codex/guncelleme-konumu-*']
permissions:
  contents: read
concurrency:
  group: guncelleme-konumu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  konum:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gerçek Electron çalıştırıcısını hazırla
        run: node -e "require('electron')"
      - name: Güncel aday kurulumunu oluştur
        run: npm run paketle:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Standart yetkiyle varsayılan ve özel klasörde aynı konuma güncelle
        shell: pwsh
        run: ./denetimler/windows-standart-kullanıcı.ps1 -KurulumKlasoru ./kurulum -GuncellemeKonumu
      - name: Kanıtları sakla
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Guncelleme-konumu-kanitlari
          path: denetim-çıktıları/
          retention-days: 14
          if-no-files-found: error
