name: Windows kurulumu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kurulum:
    name: Denetle ve Windows kurulumunu hazırla
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Node.js hazırla
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Denetimleri çalıştır
        run: npm run denetle
      - name: Kurulum dosyasını oluştur
        run: npm run paketle:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Kurulum dosyasını sakla
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Not-Defterim-Windows-Kurulumu
          path: kurulum/*.exe
          if-no-files-found: error
          retention-days: 30
