name: Notes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kurulum:
    name: Denetle ve Windows kurulumunu hazırla
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Node.js hazırla
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Denetimleri çalıştır
        run: npm run denetle
      - name: Bileşen güvenliğini denetle
        run: npm audit --audit-level=moderate
      - name: Gerçek Electron ile güvenlik ve kayıt denetimleri
        run: npm run denetle:electron
      - name: Tema görüntülerini sakla
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tema-görüntüleri
          path: denetim-çıktıları/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Kurulum dosyasını oluştur
        run: npm run paketle:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Gerçek EXE ve ASAR bütünlük davranışını denetle
        shell: pwsh
        run: ./denetimler/windows-paket.ps1
      - name: Önceki yayımlanan sürümü indir
        run: gh release download v0.0.3 --repo "$env:DEPO" --pattern "*.exe" --dir onceki-kurulum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPO: ${{ github.repository }}
      - name: Eski sürümün üzerine kurulumu ve notların korunmasını denetle
        shell: pwsh
        run: ./denetimler/windows-standart-kullanıcı.ps1
      - name: Başka standart hesaptan veri ve uygulama izinlerini denetle
        shell: pwsh
        run: ./denetimler/windows-diğer-hesap.ps1
      - name: Windows izin gözlemlerini sakla
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-izin-denetimi
          path: |
            denetim-çıktıları/windows-*.json
            denetim-çıktıları/windows-*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Kurulum dosyasını sakla
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Notes
          path: kurulum/Notes.exe
          if-no-files-found: error
          retention-days: 30

  yayinla:
    name: Doğrudan kurulum indirmesini yayımla
    needs: kurulum
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Sürüm bilgisini al
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Denetlenmiş kurulum dosyasını al
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Notes
          path: kurulum
      - name: Kurulum dosyasını Sürümler bölümüne ekle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPO: ${{ github.repository }}
          KAYNAK: ${{ github.sha }}
        run: |
          set -euo pipefail
          SURUM="v$(node -p "require('./package.json').version")"
          if gh release view "$SURUM" --repo "$DEPO" >/dev/null 2>&1; then
            gh release edit "$SURUM" --repo "$DEPO" --notes-file belgeler/sürüm-açıklaması.md
            echo "Sürüm açıklaması güncellendi; mevcut kurulum dosyası korunuyor."
            exit 0
          fi
          gh release create "$SURUM" \
            "kurulum/Notes.exe" \
            --repo "$DEPO" \
            --target "$KAYNAK" \
            --title "Notes $SURUM" \
            --notes-file belgeler/sürüm-açıklaması.md \
            --latest
